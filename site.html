<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LembreMed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <aside class="menu">
            <h2>LembreMed</h2>

            <nav>
                <a href="#">Início</a>
                <a href="#">Agenda</a>
                <a href="#">Novo Medicamento</a>
                <a href="#">Configurações</a>
            </nav>
        </aside>

        <main class="conteudo">

            <h1>Bem-vindo(a) ao LembreMed!</h1>
            <p>Organize seus medicamentos e horários.</p>
            <section class="card">
                <h2>Adicionar medicamentos</h2>
                <form>
                    <label for="medicamento">Nome do medicamento:</label>
                    <input type="text" id="medicamento" placeholder="Ex:. Medicamento prescrito">
                    <label for="horario">Horário</label>
                    <input type="time" id="horario">
                    <button type="button">Adicionar</button>
                </form>
            </section>

            <section class="card">
                <h2>Seus medicamentos</h2>
                <p>Nenhum medicamento cadastrado ainda.</p>
            </section>

        
        </main>


    </div>

    
</body>
</html>
